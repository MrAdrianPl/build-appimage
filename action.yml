name: 'Build AppImage'
description: 'Build an AppImage using appimage-builder'
branding:
  icon: 'package'
  color: 'green'
inputs:
  recipe:
    description: 'appimage-builder recipe file'
    required: true
    default: 'AppImageBuilder.yml'
  args:
    description: 'appimage-builder arguments'
    required: false
    default: '--skip-tests'
  command:
    description: 'appimage-builder start command'
    required: false
runs:
  using: composite
  steps:
    - uses: docker://revealtech/appimage-builder:1.1.2
      if: ${{!inputs.command}}
      with:
        args: appimage-builder --recipe=${{inputs.recipe}} ${{inputs.args}}
    - uses: docker://revealtech/appimage-builder:1.1.2
      if: inputs.command
      with:
        args: ${{inputs.command}}
